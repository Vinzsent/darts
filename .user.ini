; Errors are never shown to users (production hardening).
; For local development run the server with:
;   php -d display_errors=1 -S 127.0.0.1:8899
display_errors = Off

display_startup_errors = Off

; Log everything so problems are still diagnosable
log_errors = On
error_reporting = E_ALL

; Session cookie hardening (applies to every session_start() in the app).
; NOTE: add  session.cookie_secure = 1  once the site is served over HTTPS
; (with plain HTTP it would break logins).
session.cookie_httponly = 1
session.cookie_samesite = Lax
